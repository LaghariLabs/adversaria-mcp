[project]
name = "adversaria-mcp"
version = "0.2.0"
description = "MCP server for Adversaria: read your local meeting notes and to-dos, and report completed work back for your approval. On-device, no network calls of its own."
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
adversaria-mcp = "adversaria_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
