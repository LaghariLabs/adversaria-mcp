[project]
name = "adversaria-mcp"
version = "0.1.0"
description = "Sovereign-first MCP server exposing your local Adversaria meeting notes + to-dos (read-only, on-device)."
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
adversaria-mcp = "adversaria_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
